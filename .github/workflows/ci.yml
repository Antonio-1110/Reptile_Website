name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Twice: on SQLite (local dev) and on PostgreSQL (production). Postgres is where row locks really
    # happen, so the race tests in auction/test_races.py only run there.
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: ''
          - database: postgres
            database_url: postgres://postgres:postgres@localhost:5432/reptilian
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Production-like settings: DEBUG off (so the dev auth bypass is inert) with a throwaway key.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      # Empty means SQLite. The CI database has no TLS.
      DATABASE_URL: ${{ matrix.database_url }}
      DJANGO_DATABASE_SSL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # msgfmt, which the test runner uses to compile the translations (.mo files aren't committed).
      - run: sudo apt-get install -y --no-install-recommends gettext
      - run: python manage.py check
      # Fails when a model change ships without its migration.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  deploy-settings:
    # What Heroku runs, with production-shaped config vars (fake values), so a settings change that
    # would break the build, the release phase or the security checks fails here instead of in a deploy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-deploy-check-3f9a1c7e5b2d8f6a4c0e9b7d5f3a1c8e6b4d2f0a9c7e5b3d
      DJANGO_ALLOWED_HOSTS: api.reptilian.app
      DJANGO_CORS_ALLOWED_ORIGINS: https://reptilian.app,https://www.reptilian.app
      DJANGO_CSRF_TRUSTED_ORIGINS: https://api.reptilian.app
      DJANGO_FRONTEND_URL: https://reptilian.app
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reptilian
      DJANGO_DATABASE_SSL: '0'
      DJANGO_S3_BUCKET: ci-example-bucket
      DJANGO_S3_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The root requirements.txt, as Heroku installs it.
      - run: pip install -r requirements.txt
      # Heroku's build hook: compile translations without gettext, then collectstatic.
      - run: bin/post_compile
      - run: python manage.py check --deploy --fail-level WARNING
        working-directory: backend
      # The release phase, on an empty Postgres database.
      - run: python manage.py migrate --noinput
        working-directory: backend
      - name: Photos go to the S3 bucket as public URLs
        working-directory: backend
        run: |
          python manage.py shell -c "
          from django.core.files.storage import default_storage
          url = default_storage.url('listing_photos/x.jpg')
          assert url == 'https://ci-example-bucket.s3.ap-northeast-1.amazonaws.com/media/listing_photos/x.jpg', url
          "
      # gunicorn imports the app the same way the web dyno does.
      - run: gunicorn --check-config --chdir backend backend.wsgi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Real browser flows (Frontend/e2e/) against a throwaway backend with the demo data.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7
