name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Which parts of the site a pull request touches, so the jobs below can skip tests it can't affect.
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          backend=false
          frontend=false
          if [ "$EVENT" != pull_request ]; then
            # Pushes to master (what Heroku deploys) always test everything.
            backend=true
            frontend=true
          else
            # A pull request is checked out as its merge into the base branch, so the merge's first parent
            # is the base and this diff is exactly what merging would change.
            files=$(git diff --name-only HEAD^1 HEAD)
            while IFS= read -r file; do
              case "$file" in
                '' | *.md) ;;
                backend/*) backend=true ;;
                Frontend/*) frontend=true ;;
                # CI itself, Heroku's build files, the root requirements: anything shared tests everything.
                *) backend=true; frontend=true ;;
              esac
            done <<< "$files"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Backend changed: $backend. Frontend changed: $frontend."

  backend:
    # Twice: on SQLite (local dev) and on PostgreSQL (production). Postgres is where row locks really
    # happen, so the race tests in auction/test_races.py only run there.
    # The SQLite run keeps the plain name "backend": master's ruleset requires a check by that name.
    name: ${{ matrix.database == 'sqlite' && 'backend' || format('backend ({0})', matrix.database) }}
    needs: changes
    # Runs on every pull request, skipping its steps when there's nothing to test, so the check named
    # in master's ruleset always reports. (A failed `changes` job leaves the outputs empty: test everything.)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: ''
          - database: postgres
            database_url: postgres://postgres:postgres@localhost:5432/reptilian
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Production-like settings: DEBUG off (so the dev auth bypass is inert) with a throwaway key.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      # Empty means SQLite. The CI database has no TLS.
      DATABASE_URL: ${{ matrix.database_url }}
      DJANGO_DATABASE_SSL: '0'
    steps:
      - if: needs.changes.outputs.backend == 'false'
        working-directory: .
        run: echo 'This pull request changes nothing under backend/, so the backend tests are skipped.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.backend != 'false'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.backend != 'false'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        if: needs.changes.outputs.backend != 'false'
      # msgfmt, which the test runner uses to compile the translations (.mo files aren't committed).
      - run: sudo apt-get install -y --no-install-recommends gettext
        if: needs.changes.outputs.backend != 'false'
      - run: python manage.py check
        if: needs.changes.outputs.backend != 'false'
      # Fails when a model change ships without its migration.
      - run: python manage.py makemigrations --check --dry-run
        if: needs.changes.outputs.backend != 'false'
      - run: python manage.py test
        if: needs.changes.outputs.backend != 'false'

  deploy-settings:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    # What Heroku runs, with production-shaped config vars (fake values), so a settings change that
    # would break the build, the release phase or the security checks fails here instead of in a deploy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # The release phase migrates an existing database; tests create their own, so only this job needs it.
          POSTGRES_DB: reptilian
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-deploy-check-3f9a1c7e5b2d8f6a4c0e9b7d5f3a1c8e6b4d2f0a9c7e5b3d
      DJANGO_ALLOWED_HOSTS: api.reptilian.app
      DJANGO_CORS_ALLOWED_ORIGINS: https://reptilian.app,https://www.reptilian.app
      DJANGO_CSRF_TRUSTED_ORIGINS: https://api.reptilian.app
      DJANGO_FRONTEND_URL: https://reptilian.app
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reptilian
      DJANGO_DATABASE_SSL: '0'
      DJANGO_S3_BUCKET: ci-example-bucket
      DJANGO_S3_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The root requirements.txt, as Heroku installs it.
      - run: pip install -r requirements.txt
      # Heroku's build hook: compile translations without gettext, then collectstatic.
      - run: bin/post_compile
      - run: python manage.py check --deploy --fail-level WARNING
        working-directory: backend
      # The release phase, on an empty Postgres database.
      - run: python manage.py migrate --noinput
        working-directory: backend
      - name: Photos go to the S3 bucket as public URLs
        working-directory: backend
        run: |
          python manage.py shell -c "
          from django.core.files.storage import default_storage
          url = default_storage.url('listing_photos/x.jpg')
          assert url == 'https://ci-example-bucket.s3.ap-northeast-1.amazonaws.com/media/listing_photos/x.jpg', url
          "
      # gunicorn imports the app the same way the web dyno does.
      - run: gunicorn --check-config --chdir backend backend.wsgi

  frontend:
    needs: changes
    # Runs on every pull request, skipping its steps when there's nothing to test, so the check named
    # in master's ruleset always reports. (A failed `changes` job leaves the outputs empty: test everything.)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - if: needs.changes.outputs.frontend == 'false'
        working-directory: .
        run: echo 'This pull request changes nothing under Frontend/, so the frontend tests are skipped.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.frontend != 'false'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend != 'false'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        if: needs.changes.outputs.frontend != 'false'
      - run: npm run lint
        if: needs.changes.outputs.frontend != 'false'
      # The unit tests, with a coverage summary in the log.
      - run: npm run test:coverage
        if: needs.changes.outputs.frontend != 'false'
      - run: npm run build
        if: needs.changes.outputs.frontend != 'false'

  e2e:
    # Real browser flows (Frontend/e2e/) against a throwaway backend with the demo data. They use both
    # halves of the site, so a change to either runs them.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7
